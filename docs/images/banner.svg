<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title">
  <title id="title">MJReader — Пространство для чтения</title>
  <defs>
    <linearGradient id="bg" x2="100%" y2="100%"><stop stop-color="#222431"/><stop offset="1" stop-color="#10121B"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#F25BD5" stop-opacity=".25"/><stop offset="1" stop-color="#F25BD5" stop-opacity="0"/></radialGradient>
    <linearGradient id="front" x2="80%" y2="100%"><stop stop-color="#C699FF"/><stop offset="1" stop-color="#F25BD5"/></linearGradient>
    <linearGradient id="warm" x2="85%" y2="95%"><stop stop-color="#F25BD5"/><stop offset="1" stop-color="#F25BD5" stop-opacity=".56"/></linearGradient>
    <linearGradient id="page" x2="80%" y2="100%"><stop stop-color="#F25BD5"/><stop offset="1" stop-color="#9A45CA"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="360" rx="26"/></clipPath>
  </defs>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .light { animation: breathe 2.8s ease-out both; }
